<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de notas</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--text:#1d2330;--muted:#6b7385;--accent:#3b6fd8;--line:#e3e6ef;--ok:#2e9e5b;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#15181f;--card:#1f242e;--text:#e8ebf2;--muted:#9aa3b5;--accent:#7aa2f7;--line:#2c3340;--ok:#5fd08a;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{max-width:560px;margin:0 auto;padding:20px 0 40px}
h1{font-size:22px;margin:8px 0 16px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.big{display:flex;align-items:baseline;gap:8px}
.big span{font-size:48px;font-weight:700;color:var(--accent);line-height:1}
.big small{color:var(--muted);font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;color:var(--muted);font-size:14px}
.stats b{color:var(--text)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:14px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.info{flex:1;min-width:0}
.name{font-weight:600;font-size:15px}
.meta{color:var(--muted);font-size:12px;margin-top:2px}
.nota{width:90px;padding:10px;font-size:17px;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
.nota:focus{outline:2px solid var(--accent);border-color:transparent}
.note{color:var(--muted);font-size:12px;margin:14px 2px}
button{margin-top:8px;padding:10px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Mis notas</h1>

  <section class="summary">
    <div class="big"><span id="acum">0.00</span><small>/ 20 acumulado</small></div>
    <div class="stats">
      <div>Evaluado: <b id="pct">0</b>% del total</div>
      <div>Promedio de lo evaluado: <b id="prom">—</b> / 20</div>
    </div>
    <div class="bar"><div id="bar"></div></div>
  </section>

  <section id="list"></section>

  <p class="note">Escribe la nota sobre 20 en cada evaluación. Puedes cambiarla cuando quieras; el total se recalcula solo.</p>
  <button id="reset">Borrar todas las notas</button>
</main>

<script>
const items = [
  { name: "Quiz",                    date: "02/10/26", w: 10 },
  { name: "Taller 1",                date: "16/10/26", w: 15 },
  { name: "Parcial 1",               date: "11/11/26", w: 25 },
  { name: "Lúdo",                    date: "13/11/26", w: 5  },
  { name: "Taller 2",                date: "04/12/26", w: 15 },
  { name: "Parcial 2",               date: "08/01/27", w: 20 },
  { name: "Pre-parcial 1 (Evaluación continua)", date: "05/11/26", w: 5 },
  { name: "Pre-parcial 2 (Evaluación continua)", date: "17/12/26", w: 5 }
];

const grades = items.map(() => null);

const list = document.getElementById("list");
items.forEach((it, i) => {
  const row = document.createElement("div");
  row.className = "card";
  row.innerHTML = `
    <div class="info">
      <div class="name">${it.name}</div>
      <div class="meta">${it.date} · ${it.w}%</div>
    </div>
    <input class="nota" type="number" inputmode="decimal" min="0" max="20" step="0.1" placeholder="—" aria-label="Nota de ${it.name}">`;
  const input = row.querySelector("input");
  input.addEventListener("input", () => {
    let v = input.value.trim() === "" ? null : parseFloat(input.value);
    if (v !== null && (isNaN(v))) v = null;
    if (v !== null) v = Math.min(20, Math.max(0, v));
    grades[i] = v;
    update();
  });
  list.appendChild(row);
  row._input = input;
});

function update() {
  let acum = 0, wDone = 0;
  items.forEach((it, i) => {
    if (grades[i] !== null) {
      acum += grades[i] * it.w / 100;
      wDone += it.w;
    }
  });
  document.getElementById("acum").textContent = acum.toFixed(2);
  document.getElementById("pct").textContent = wDone;
  document.getElementById("prom").textContent = wDone ? (acum * 100 / wDone).toFixed(2) : "—";
  document.getElementById("bar").style.width = (acum / 20 * 100) + "%";
}

document.getElementById("reset").addEventListener("click", () => {
  grades.fill(null);
  [...list.children].forEach(r => r._input.value = "");
  update();
});

update();
</script>
</body>
</html>
